<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Password - EstiGen</title>
    <link rel="stylesheet" href="admin-styles.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #f5f7fa 0%, #344767 100%);
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        .reset-card {
            background: white;
            padding: 3rem;
            border-radius: 16px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 420px;
            text-align: center;
        }

        .reset-header {
            margin-bottom: 2rem;
        }

        .security-icon {
            font-size: 3rem;
            margin-bottom: 1rem;
            display: block;
        }

        .reset-header h1 {
            color: #1e3c72;
            font-size: 1.75rem;
            margin-bottom: 0.5rem;
        }

        .reset-header p {
            color: #6c757d;
            font-size: 0.95rem;
            line-height: 1.5;
        }

        .form-group {
            text-align: left;
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            color: #344767;
            font-size: 0.9rem;
        }

        .form-group input {
            width: 100%;
            padding: 0.9rem 1rem;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 1rem;
            box-sizing: border-box;
            transition: all 0.3s ease;
        }

        .form-group input:focus {
            border-color: #1e3c72;
            outline: none;
            box-shadow: 0 0 0 3px rgba(30, 60, 114, 0.1);
        }

        .password-requirements {
            background: #f8fafc;
            padding: 1rem;
            border-radius: 8px;
            text-align: left;
            margin-bottom: 1.5rem;
            font-size: 0.85rem;
            color: #64748b;
        }

        .requirement {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 0.25rem;
        }

        .btn-reset {
            width: 100%;
            padding: 1rem;
            background: #1e3c72;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-reset:hover {
            background: #2a5298;
            transform: translateY(-2px);
        }

        .btn-reset:disabled {
            background: #cbd5e1;
            cursor: not-allowed;
            transform: none;
        }

        #message {
            margin-top: 1rem;
            padding: 0.75rem;
            border-radius: 6px;
            font-size: 0.9rem;
            display: none;
        }

        .error {
            background: #fef2f2;
            color: #dc2626;
            border: 1px solid #fee2e2;
        }

        .success {
            background: #f0fdf4;
            color: #16a34a;
            border: 1px solid #dcfce7;
        }
    </style>
</head>

<body>
    <div class="reset-card">
        <div class="reset-header">
            <span class="security-icon">🛡️</span>
            <h1>Update Password</h1>
            <p>Your administrator requires you to update your password before accessing EstiGen.</p>
        </div>

        <div class="password-requirements">
            <div class="requirement">✅ At least 8 characters</div>
            <div class="requirement">✅ Use a mix of letters & numbers</div>
        </div>

        <form id="reset-form" onsubmit="handleChange(event)">
            <div class="form-group">
                <label for="new-password">New Password</label>
                <input type="password" id="new-password" required minlength="8" placeholder="Enter new password">
            </div>

            <div class="form-group">
                <label for="confirm-password">Confirm New Password</label>
                <input type="password" id="confirm-password" required minlength="8" placeholder="Confirm new password">
            </div>

            <div id="message"></div>

            <button type="submit" class="btn-reset" id="submit-btn">Update & Continue</button>
        </form>
    </div>

    <script src="auth.js"></script>
    <script>
        // Check auth immediately (must be logged in to change password)
        document.addEventListener('DOMContentLoaded', async () => {
            await checkAuth('user-login.html');
        });

        async function handleChange(e) {
            e.preventDefault();

            const newPass = document.getElementById('new-password').value;
            const confirmPass = document.getElementById('confirm-password').value;
            const msg = document.getElementById('message');
            const btn = document.getElementById('submit-btn');

            if (newPass !== confirmPass) {
                showMessage('Passwords do not match. Please try again.', 'error');
                return;
            }

            try {
                btn.disabled = true;
                btn.textContent = 'Updating...';

                await updatePassword(newPass);

                showMessage('Password updated successfully! Redirecting...', 'success');

                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 1500);
            } catch (error) {
                console.error(error);
                showMessage(error.message || 'Failed to update password.', 'error');
                btn.disabled = false;
                btn.textContent = 'Update & Continue';
            }
        }

        function showMessage(text, type) {
            const msg = document.getElementById('message');
            msg.textContent = text;
            msg.className = type;
            msg.style.display = 'block';
        }
    </script>
</body>

</html>
