<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Single Line Diagram</title>
    <style>
        :root {
            --primary-color: #00796B; /* Teal */
            --secondary-color: #004D40; /* Darker Teal */
            --accent-color: #FFAB40; /* Amber */
            --light-gray: #ECEFF1; /* Blue Grey 50 */
            --medium-gray: #B0BEC5; /* Blue Grey 200 */
            --dark-gray: #37474F; /* Blue Grey 800 */
            --white: #ffffff;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--light-gray);
            margin: 0;
            padding: 2rem;
            color: var(--dark-gray);
        }
        .header {
            background-color: var(--primary-color);
            color: var(--white);
            padding: 1rem 2rem;
            border-radius: 8px 8px 0 0;
        }
        .header h1 { margin: 0; }
        .sld-canvas {
            background-color: var(--white);
            padding: 2rem;
            border-radius: 0 0 8px 8px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        .sld-toolbar {
            margin-bottom: 1.5rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--medium-gray);
            display: flex;
            gap: 1rem;
        }
        .btn { padding: 0.6rem 1.2rem; font-size: 0.9rem; font-weight: 600; border: 1px solid var(--primary-color); border-radius: 4px; cursor: pointer; transition: background-color 0.2s; }
        .btn-primary { background-color: var(--primary-color); color: var(--white); }
        .btn-primary:hover { background-color: var(--secondary-color); }
        .btn-secondary { background-color: var(--white); color: var(--primary-color); }
        #sld-container {
            display: flex;
            flex-direction: column;
            gap: 2rem;
            padding: 1rem;
            border: 1px solid var(--medium-gray);
            border-radius: 8px;
            background-color: #fdfdfd;
            overflow: auto; /* Ensure container itself can scroll if needed */
        }
        .sld-voltage-group {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding-bottom: 1rem; /* Add padding for scrollbar visibility */
        }
        .sld-voltage-label {
            font-weight: 600;
            color: var(--secondary-color);
            width: 100px;
            text-align: right;
            flex-shrink: 0;
        }
        .svg-wrapper {
            overflow: visible; /* Allow nodes to be visible outside SVG bounds to permit overlapping */
            padding-bottom: 10px;
            position: relative;
        }
        .draggable-group {
            cursor: move; /* Change cursor to indicate draggability */
        }
    </style>
</head>
<body>

<div class="header">
    <h1 id="sld-title">Single Line Diagram</h1>
</div>
<div class="sld-canvas">
    <div class="sld-toolbar">
        <button class="btn btn-primary" onclick="saveSldLayout()">Save Layout</button>
        <button class="btn btn-secondary" onclick="resetSldLayout()">Reset Layout</button>
        <button class="btn btn-secondary" id="toggle-labels-btn" onclick="toggleLabels()">Hide Labels</button>
    </div>
    <div id="sld-container">
        <p>Loading diagram...</p>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const estimateData = JSON.parse(sessionStorage.getItem('estimateDataForSLD'));
        const structureLibrary = JSON.parse(sessionStorage.getItem('structureLibraryForSLD'));

        if (!estimateData || !structureLibrary) {
            document.getElementById('sld-container').innerHTML = '<p>Error: Estimate data not found. Please generate an estimate first.</p>';
            return;
        }

        document.getElementById('sld-title').textContent = `SLD for: ${estimateData.workName}`;
        renderSingleLineDiagram('sld-container', estimateData, structureLibrary);
    }); 

    function renderSingleLineDiagram(containerId, estimate, structureLibrary) {
        const container = document.getElementById(containerId);
        if (!container) return;
        container.innerHTML = '';

        // Load saved layout from session storage
        const savedLayout = JSON.parse(sessionStorage.getItem('sldLayout') || '{}');

        const iconMap = {
            '33 kV': (x, y) => `<rect x="${x-8}" y="${y-8}" width="16" height="16" fill="#00796B" />`,
            '11 kV': (x, y) => `<circle cx="${x}" cy="${y}" r="8" fill="#FFAB40" />`,
            'DTR': (x, y) => `<polygon points="${x},${y-9} ${x-9},${y+6} ${x+9},${y+6}" fill="#F44336" />`,
            'LT 3-Ph': (x, y) => `<rect x="${x-6}" y="${y-6}" width="12" height="12" transform="rotate(45 ${x} ${y})" fill="#37474F" />`,
            'LT 1-Ph': (x, y) => `<circle cx="${x}" cy="${y}" r="6" fill="#B0BEC5" />`,
            'Special Structure': (x, y) => `<polygon points="${x},${y-10} ${x+3},${y-3} ${x+10},${y-2} ${x+4},${y+4} ${x+6},${y+10} ${x},${y+7} ${x-6},${y+10} ${x-4},${y+4} ${x-10},${y-2} ${x-3},${y-3}" fill="#673AB7" />`,
            'default': (x, y) => `<circle cx="${x}" cy="${y}" r="7" fill="#777" />`
        };

        const structuresByVoltage = {};
        function sanitizeId(str) {
            return String(str).replace(/\s+/g, '_').replace(/[^a-zA-Z0-9_\-]/g, '');
        }

        for (const voltage of estimate.voltageLevels) {
            structuresByVoltage[voltage] = [];
        }

        for (const structureId in estimate.structures) {
            const quantity = estimate.structures[structureId];
            const structure = structureLibrary.find(s => s.id === structureId);
            if (structure) {
                const relevantVoltage = estimate.voltageLevels.find(v => structure.voltage.includes(v));
                if (relevantVoltage) {
                    for (let i = 0; i < quantity; i++) {
                        structuresByVoltage[relevantVoltage].push(structure);
                    }
                }
            }
        }

        for (const voltage of estimate.voltageLevels) {
            const structures = structuresByVoltage[voltage];
            if (structures.length === 0) continue;

            const groupDiv = document.createElement('div');
            groupDiv.className = 'sld-voltage-group';

            const labelDiv = document.createElement('div');
            labelDiv.className = 'sld-voltage-label';
            labelDiv.textContent = voltage;
            groupDiv.appendChild(labelDiv);

            // Determine node positions (either default or from saved layout)
            const vid = sanitizeId(voltage);
            const nodes = structures.map((s, i) => {
                const svgHeight = 200; // Define it here for default y-pos
                const groupId = `group-${vid}-${i}`;
                const defaultPos = { x: 40 + (i * 80), y: svgHeight / 2 };
                return savedLayout[groupId] || defaultPos;
            });

            // Calculate SVG width based on the rightmost node
            const maxX = Math.max(...nodes.map(n => n.x));
            const svgWidth = maxX + 80;
            const svgHeight = 200; // Increased height for more dragging room

            let svgContent = `<svg width="${svgWidth}" height="${svgHeight}" xmlns="http://www.w3.org/2000/svg" overflow="visible" style="overflow:visible;">`;
            
            // Draw line segments between nodes first
            structures.forEach((s, i) => {
                if (i < structures.length - 1) {
                    const { x: x1, y: y1 } = nodes[i];
                    const { x: x2, y: y2 } = nodes[i+1];
                    svgContent += `<line id="line-${vid}-${i}" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#B0BEC5" stroke-width="2" />`;
                }
            });

            // Draw the structure icons on top of the lines
            structures.forEach((s, i) => {
                const { x, y } = nodes[i];
                const iconFunc = iconMap[voltage] || iconMap['default'];

                // Determine rotation for angle/tangent structures
                let rotation = 0;
                const lowerCaseName = s.name.toLowerCase();
                if (lowerCaseName.includes('angle')) {
                    rotation = 30;
                } else if (lowerCaseName.includes('tangent')) {
                    rotation = 15;
                }
                const rotationTransform = rotation > 0 ? `rotate(${rotation})` : '';

                // Add a class for dragging and a unique ID, include struct id and any custom label
                const safeCustom = (s.customLabel || '').toString().replace(/"/g, '&quot;');
                svgContent += `<g class="draggable-group" id="group-${vid}-${i}" data-index="${i}" data-voltage="${vid}" data-voltage-raw="${voltage}" data-struct-id="${s.id}" data-custom-label="${safeCustom}" transform="translate(${x}, ${y})">`;
                svgContent += `<g class="icon-wrapper" transform="${rotationTransform}">${iconFunc(0, 0)}</g>`; // iconFunc is centered at (0,0) of the group
                const displayLabel = (s.customLabel || s.name || s.id);
                svgContent += `<text class="sld-label" x="0" y="-20" font-size="10" text-anchor="middle" fill="#333" style="cursor:text;">${displayLabel}</text>`;
                svgContent += `</g>`;
            });

            svgContent += `</svg>`;
            
            const svgContainer = document.createElement('div');
            svgContainer.className = 'svg-wrapper';
            svgContainer.innerHTML = svgContent;
            // Fix the wrapper height so vertical expansion of the svg doesn't push other rows
            svgContainer.style.minHeight = svgHeight + 'px';
            groupDiv.appendChild(svgContainer);

            container.appendChild(groupDiv);

            // Make the SVG elements draggable after they are in the DOM
            const svgElement = svgContainer.querySelector('svg');
            makeDraggable(svgElement);

            // Attach direct dblclick handlers to labels to avoid pointer capture interference
            svgElement.querySelectorAll('.sld-label').forEach(label => {
                // ensure the text element accepts pointer events
                label.style.pointerEvents = 'auto';
                label.style.userSelect = 'none';

                // Regular dblclick listener (mouse)
                label.addEventListener('dblclick', (ev) => {
                    ev.stopPropagation();
                    editLabel(label);
                });

                // Pointer-based double-tap fallback (for pointer capture/touch where dblclick may not fire)
                let lastTap = 0;
                label.addEventListener('pointerdown', (ev) => {
                    const now = Date.now();
                    const delta = now - lastTap;
                    lastTap = now;
                    // consider double-tap if within 400ms
                    if (delta > 0 && delta < 400) {
                        ev.preventDefault();
                        ev.stopPropagation();
                        editLabel(label);
                    }
                });
            });

            function editLabel(label) {
                const group = label.closest('.draggable-group');
                if (!group) return;
                const current = label.textContent || '';
                const newLabel = prompt('Edit node label:', current);
                if (newLabel === null) return; // cancelled
                label.textContent = newLabel;
                group.dataset.customLabel = newLabel;
                try {
                    const lib = JSON.parse(sessionStorage.getItem('structureLibraryForSLD') || '[]');
                    const structId = group.dataset.structId;
                    const found = lib.find(x => String(x.id) === String(structId));
                    if (found) {
                        found.customLabel = newLabel;
                        sessionStorage.setItem('structureLibraryForSLD', JSON.stringify(lib));
                    }
                } catch (e) {
                    console.error('Failed to persist label to sessionStorage', e);
                }
            }
        }
    }

    function makeDraggable(svg) {
        let selectedElement = null;
        let pointerId = null;
        let offset = { x: 0, y: 0 };
        let pending = null;
        let rafId = null;

        // Keep existing dblclick behavior for label editing
        svg.addEventListener('dblclick', function(evt){
            const group = evt.target.closest('.draggable-group');
            if (!group) return;
            const textEl = group.querySelector('.sld-label');
            if (!textEl) return;
            const current = textEl.textContent || '';
            const newLabel = prompt('Edit node label:', current);
            if (newLabel === null) return; // cancelled
            textEl.textContent = newLabel;
            group.dataset.customLabel = newLabel;
            try {
                const lib = JSON.parse(sessionStorage.getItem('structureLibraryForSLD') || '[]');
                const structId = group.dataset.structId;
                const found = lib.find(x => String(x.id) === String(structId));
                if (found) {
                    found.customLabel = newLabel;
                    sessionStorage.setItem('structureLibraryForSLD', JSON.stringify(lib));
                }
            } catch (e) {
                console.error('Failed to persist label to sessionStorage', e);
            }
        });

        svg.addEventListener('pointerdown', onPointerDown, { passive: false });
        svg.addEventListener('pointermove', onPointerMove, { passive: false });
        svg.addEventListener('pointerup', onPointerUp);
        svg.addEventListener('pointercancel', onPointerUp);

        function getMousePosition(evt) {
            const CTM = svg.getScreenCTM();
            const e = CTM ? CTM.e : 0;
            const f = CTM ? CTM.f : 0;
            const a = CTM ? CTM.a : 1;
            const d = CTM ? CTM.d : 1;
            return {
                x: (evt.clientX - e) / a,
                y: (evt.clientY - f) / d,
            };
        }

        function onPointerDown(evt) {
            const targetGroup = evt.target.closest('.draggable-group');
            if (!targetGroup) return;
            evt.preventDefault();
            selectedElement = targetGroup;
            pointerId = evt.pointerId;
            try { svg.setPointerCapture(pointerId); } catch (e) {}
            const mouse = getMousePosition(evt);

            // Ensure translate transform exists
            const tlist = selectedElement.transform.baseVal;
            if (tlist.numberOfItems === 0) {
                const transform = svg.createSVGTransform();
                transform.setTranslate(0, 0);
                tlist.appendItem(transform);
            }
            const transform = selectedElement.transform.baseVal.getItem(0);
            offset.x = mouse.x - transform.matrix.e;
            offset.y = mouse.y - transform.matrix.f;

            // Bring to front so overlapping is obvious
            try { svg.appendChild(selectedElement); } catch (e) { /* ignore */ }
        }

        function onPointerMove(evt) {
            if (!selectedElement || evt.pointerId !== pointerId) return;
            evt.preventDefault();
            const mouse = getMousePosition(evt);
            pending = { x: mouse.x - offset.x, y: mouse.y - offset.y };
            if (!rafId) rafId = requestAnimationFrame(applyPending);
        }

        function applyPending() {
            rafId = null;
            if (!pending || !selectedElement) return;
            const newX = pending.x;
            const newY = pending.y;
            pending = null;

            const tlist = selectedElement.transform.baseVal;
            if (tlist.numberOfItems === 0) {
                const tr = svg.createSVGTransform();
                tr.setTranslate(newX, newY);
                tlist.appendItem(tr);
            } else {
                tlist.getItem(0).setTranslate(newX, newY);
            }

            const index = parseInt(selectedElement.dataset.index, 10);
            const vid = selectedElement.dataset.voltage; // sanitized id

            if (index > 0) {
                const prevLine = svg.querySelector(`#line-${vid}-${index - 1}`);
                if (prevLine) {
                    prevLine.setAttribute('x2', newX);
                    prevLine.setAttribute('y2', newY);
                }
            }
            const nextLine = svg.querySelector(`#line-${vid}-${index}`);
            if (nextLine) {
                nextLine.setAttribute('x1', newX);
                nextLine.setAttribute('y1', newY);
            }

            // Expand SVG if dragged far out of bounds so it remains visible, but allow negative positions for overlap
            try {
                const wrapper = svg.parentElement; // .svg-wrapper
                const curWidth = Number(svg.getAttribute('width')) || svg.clientWidth || 800;
                const curHeight = Number(svg.getAttribute('height')) || svg.clientHeight || 200;
                const margin = 120;
                let needResize = false;
                let newSvgWidth = curWidth;
                let newSvgHeight = curHeight;

                if (newX + margin > curWidth) {
                    newSvgWidth = Math.max(Math.ceil(newX + margin), Math.ceil(curWidth * 1.2));
                    needResize = true;
                }
                if (newY + margin > curHeight) {
                    newSvgHeight = Math.max(Math.ceil(newY + margin), Math.ceil(curHeight * 1.15));
                    needResize = true;
                }

                if (needResize) {
                    svg.setAttribute('width', String(newSvgWidth));
                    // Do NOT change svg height - allow overflow so rows don't reflow
                    if (wrapper && wrapper.scrollTo) wrapper.scrollTo({ left: Math.max(newX - 120, 0), top: Math.max(newY - 120, 0), behavior: 'auto' });
                }
            } catch (err) {
                console.warn('Error while expanding SVG:', err);
            }
        }

        function onPointerUp(evt) {
            if (!selectedElement || evt.pointerId !== pointerId) return;
            try { svg.releasePointerCapture(pointerId); } catch (e) {}
            pointerId = null;
            selectedElement = null;
            if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
            pending = null;
        }
    }

    function saveSldLayout() {
        const layout = {};
        document.querySelectorAll('.draggable-group').forEach(group => {
            const transform = group.transform.baseVal.getItem(0);
            if (transform && transform.type === SVGTransform.SVG_TRANSFORM_TRANSLATE) {
                layout[group.id] = {
                    x: transform.matrix.e,
                    y: transform.matrix.f
                };
            }
        });
        sessionStorage.setItem('sldLayout', JSON.stringify(layout));
        alert('Layout saved for this session!');
    }

    function resetSldLayout() {
        if (confirm('Are you sure you want to reset the layout to its default positions?')) {
            sessionStorage.removeItem('sldLayout');
            // Re-render the diagram by reloading the data
            document.dispatchEvent(new Event('DOMContentLoaded'));
        }
    }

    let areLabelsVisible = true;
    function toggleLabels() {
        areLabelsVisible = !areLabelsVisible;
        const labels = document.querySelectorAll('.sld-label');
        const button = document.getElementById('toggle-labels-btn');

        labels.forEach(label => {
            label.style.display = areLabelsVisible ? '' : 'none';
        });

        if (button) {
            button.textContent = areLabelsVisible ? 'Hide Labels' : 'Show Labels';
        }
    }
</script>
</body>
</html>
