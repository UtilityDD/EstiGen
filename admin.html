<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EstiGen Admin Panel - Database Management</title>
    <link rel="stylesheet" href="admin-styles.css">
</head>

<body>
    <div class="admin-container">
        <!-- Header -->
        <header class="admin-header">
            <div class="header-content">
                <h1>🛠️ EstiGen Admin Panel</h1>
                <div class="header-actions">
                    <a href="index.html" class="btn btn-secondary">← Back to App</a>
                    
                </div>
            </div>
        </header>

        <!-- Tab Navigation -->
        <nav class="tab-navigation">
            <button class="tab-btn active" data-table="structures">
                📋 Structures
            </button>
            <button class="tab-btn" data-table="materials">
                🔩 Materials
            </button>
            <button class="tab-btn" data-table="labour">
                👷 Labour
            </button>
        </nav>

        <!-- Notification Bar -->
        <div id="notification" class="notification hidden"></div>

        <!-- Main Content Area -->
        <main class="admin-main">
            <!-- Toolbar -->
            <div class="toolbar">
                <div class="toolbar-left">
                    <div class="search-box">
                        <input type="text" id="search-input" placeholder="Search...">
                        <button id="search-btn" class="btn btn-icon">🔍</button>
                    </div>
                    <select id="filter-select" class="filter-select">
                        <option value="">All Categories</option>
                    </select>
                </div>
                <div class="toolbar-right">
                    <button id="add-new-btn" class="btn btn-primary">+ Add New</button>
                    <button id="delete-selected-btn" class="btn btn-danger" disabled>🗑️ Delete Selected</button>
                    <button id="export-btn" class="btn btn-secondary">📥 Export</button>
                    <button id="refresh-btn" class="btn btn-icon">🔄</button>
                </div>
            </div>

            <!-- Loading State -->
            <div id="loading-state" class="loading-state hidden">
                <div class="spinner"></div>
                <p>Loading data...</p>
            </div>

            <!-- Data Table Container -->
            <div id="table-container" class="table-container">
                <!-- Table will be dynamically inserted here -->
            </div>

            <!-- Pagination -->
            <div class="pagination" id="pagination">
                <div class="pagination-info">
                    Showing <span id="showing-start">0</span>-<span id="showing-end">0</span> of <span
                        id="total-records">0</span>
                </div>
                <div class="pagination-controls">
                    <button id="prev-page" class="btn btn-secondary" disabled>← Previous</button>
                    <span class="page-numbers" id="page-numbers"></span>
                    <button id="next-page" class="btn btn-secondary" disabled>Next →</button>
                </div>
            </div>
        </main>

        <!-- Modal for Add/Edit -->
        <div id="edit-modal" class="modal hidden">
            <div class="modal-content">
                <div class="modal-header">
                    <h2 id="modal-title">Edit Record</h2>
                    <button class="modal-close" onclick="closeModal()">×</button>
                </div>
                <div class="modal-body" id="modal-body">
                    <!-- Form fields will be dynamically inserted -->
                </div>
                <div class="modal-footer">
                    <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
                    <button class="btn btn-primary" id="save-record-btn">Save</button>
                </div>
            </div>
        </div>
    </div>

    <script src="admin-new.js"></script>
</body>

</html>
