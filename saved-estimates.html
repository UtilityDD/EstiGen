<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saved Estimates - EstiGen</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="auth.js"></script>
    <script>
        // Check authentication immediately to prevent flashing of private content
        (async function () {
            const user = await checkAuth('user-login.html');
            if (user) {
                document.documentElement.classList.add('auth-verified');
                window.currentUser = user;
            }
        })();
    </script>
    <style>
        /* Hide content until auth is verified */
        html:not(.auth-verified) body {
            display: none;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header">
            <div class="header-brand">
                <img src="logo.jpg" alt="EstiGen Logo" class="header-logo">
            </div>

            <div class="user-status">
                <div class="header-nav" style="margin-right: 15px;">
                    <a href="index.html">← Back to Generator</a>
                </div>

                <div class="user-profile" id="user-profile-trigger" onclick="toggleUserDropdown()">
                    <div class="user-avatar" id="user-initials">U</div>
                    <div class="profile-info">
                        <span class="profile-name" id="user-name">User</span>
                        <span class="profile-email" id="user-email">user@example.com</span>
                    </div>
                </div>

                <div class="user-dropdown" id="user-dropdown">
                    <a href="index.html" class="dropdown-item">📊 New Estimate</a>
                    <a href="admin.html" id="admin-dropdown-link" class="dropdown-item hidden">🛠️ Admin Panel</a>
                    <div class="dropdown-divider"></div>
                    <div class="dropdown-item" onclick="logout()" style="color: var(--error-color);">🚪 Logout</div>
                </div>
            </div>
        </div>

        <div class="content-container">
            <!-- Stats/Summary cards could go here in future -->

            <div class="card table-card">
                <div class="card-header">
                    <div class="search-wrapper">
                        <span class="search-icon">🔍</span>
                        <input type="text" id="searchInput" placeholder="Search estimates...">
                    </div>
                    <button class="btn btn-secondary btn-refresh" onclick="refreshEstimates()">
                        <span>🔄</span> Refresh
                    </button>
                </div>

                <div class="table-responsive">
                    <table class="data-table" id="estimatesTable">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Work Name</th>
                                <th>Category</th>
                                <th>Date Created</th>
                                <th class="text-right">Total (₹)</th>
                                <th class="text-center">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="estimatesBody">
                            <!-- Estimates will be loaded here -->
                        </tbody>
                    </table>
                </div>

                <div id="emptyState" class="empty-state" style="display: none;">
                    <div class="empty-icon">📁</div>
                    <h3>No Saved Estimates</h3>
                    <p>Estimates you save will appear here.</p>
                    <a href="index.html" class="btn btn-primary">Create New Estimate</a>
                </div>

                <div id="loader" class="loader-overlay" style="display: none;">
                    <div class="spinner"></div>
                    <p>Loading...</p>
                </div>
            </div>
        </div>
    </div>

    <script src="saved-estimates.js"></script>
</body>

</html>
